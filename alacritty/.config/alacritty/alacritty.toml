[[colors.indexed_colors]]
color = "0xd18616"
index = 16

[[colors.indexed_colors]]
color = "0xf97583"
index = 17

[colors.bright]
black = "0x959da5"
blue = "0x79b8ff"
cyan = "0x56d4dd"
green = "0x85e89d"
magenta = "0xb392f0"
red = "0xf97583"
white = "0xfafbfc"
yellow = "0xffea7f"

[colors.normal]
black = "0x586069"
blue = "0x2188ff"
cyan = "0x39c5cf"
green = "0x34d058"
magenta = "0xb392f0"
red = "0xea4a5a"
white = "0xd1d5da"
yellow = "0xffea7f"

[colors.primary]
background = "0x24292e"
foreground = "0xd1d5da"

[env]
TERM = "xterm-256color"

[font]
size = 12

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.glyph_offset]
x = 0
y = 1

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 1

[shell]
args = ["-l", "-c", "tmux attach || tmux"]
program = "/bin/zsh"

[window]
decorations = "buttonless"
dynamic_padding = true
opacity = 0.95
option_as_alt = "none"

[window.padding]
x = 14
y = 14
