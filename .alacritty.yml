env:
  TERM: xterm-256color

window:
  padding:
    x: 14
    y: 14
  dynamic_padding: true
  decorations: buttonless
  opacity: 0.95

  # option_as_alt: "None"

shell:
  program: /bin/zsh
  args:
    - -l
    - -c
    - "tmux attach || tmux"


font:
  normal:
    family: Hack Nerd Font
    style: Regular
  bold:
    family: Hack Nerd Font
    style: Bold
  italic:
    family: Hack Nerd Font
    style: Italic
  size: 12
  # scale_with_dpi: true
  # AppleFontSmoothing: true
  # Offset is the extra space around each character. offset.y can be thought of
  # as modifying the linespacing, and offset.x as modifying the letter spacing.
  offset:
    x: 0
    y: 1

  # Glyph offset determines the locations of the glyphs within their cells with
  # the default being at the bottom. Increase the x offset to move the glyph to
  # the right, increase the y offset to move the glyph upward.
  glyph_offset:
    x: 0
    y: 1

mouse:
  hints:
    modifiers: Shift

# key_bindings:
#   # - { key: Space, mods: Control, chars: "\x00" }
#   - { key: 24,     mods: Shift|None,    chars: "'"                  }
#   - { key: Grave,     mods: None,    chars: "´"                  }

# github Alacritty Colors
colors:
  # Default colors
  primary:
    background: '0x24292e'
    foreground: '0xd1d5da'

  # Normal colors
  normal:
    black:   '0x586069'
    red:     '0xea4a5a'
    green:   '0x34d058'
    yellow:  '0xffea7f'
    blue:    '0x2188ff'
    magenta: '0xb392f0'
    cyan:    '0x39c5cf'
    white:   '0xd1d5da'

  # Bright colors
  bright:
    black:   '0x959da5'
    red:     '0xf97583'
    green:   '0x85e89d'
    yellow:  '0xffea7f'
    blue:    '0x79b8ff'
    magenta: '0xb392f0'
    cyan:    '0x56d4dd'
    white:   '0xfafbfc'

  indexed_colors:
    - { index: 16, color: '0xd18616' }
    - { index: 17, color: '0xf97583' }
